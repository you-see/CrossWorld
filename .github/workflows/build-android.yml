```yaml
name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Show versions
        run: |
          echo "===== Node ====="
          node --version

          echo "===== NPM ====="
          npm --version

          echo "===== Java ====="
          java -version

          echo "===== Environment ====="
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Install dependencies
        run: |
          echo "===== npm ci ====="
          npm ci

      - name: Build web app
        run: |
          echo "===== npm run build ====="
          npm run build

      - name: Check Capacitor
        run: |
          echo "===== Capacitor ====="
          npx cap --version

          echo "===== Project files ====="
          ls -la

          echo "===== Android directory ====="
          if [ -d android ]; then
            ls -la android
          else
            echo "ERROR: android directory does not exist"
            exit 1
          fi

      - name: Sync Capacitor
        run: |
          echo "===== npx cap sync android ====="
          npx cap sync android

      - name: Check Android project
        run: |
          echo "===== Android directory ====="
          ls -la android

          echo "===== Gradle wrapper ====="
          ls -la android/gradlew
          file android/gradlew

          echo "===== Gradle wrapper first lines ====="
          head -n 10 android/gradlew

          echo "===== Gradle wrapper properties ====="
          cat android/gradle/wrapper/gradle-wrapper.properties

      - name: Build Android APK
        working-directory: android
        shell: bash
        run: |
          chmod +x gradlew

          echo ""
          echo "=========================================="
          echo "           GRADLE VERSION"
          echo "=========================================="

          ./gradlew --version

          echo ""
          echo "=========================================="
          echo "       STARTING ANDROID BUILD"
          echo "=========================================="

          set -o pipefail

          ./gradlew assembleDebug \
            --stacktrace \
            --info \
            --console=plain \
            2>&1 | tee gradle-build.log

          BUILD_EXIT=${PIPESTATUS[0]}

          echo ""
          echo "=========================================="
          echo "       GRADLE EXIT CODE: ${BUILD_EXIT}"
          echo "=========================================="

          echo ""
          echo "=========================================="
          echo "       LAST 300 LINES OF LOG"
          echo "=========================================="

          tail -n 300 gradle-build.log

          exit ${BUILD_EXIT}

      - name: Show generated APK
        if: success()
        run: |
          echo "===== APK files ====="
          find android/app/build/outputs -type f -print

      - name: Upload Gradle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: |
            android/gradle-build.log
          if-no-files-found: warn

      - name: Upload Android diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-diagnostics
          path: |
            android/
            capacitor.config.*
          if-no-files-found: warn

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: crossworld-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
```
