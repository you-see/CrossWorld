name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v5

      # ------------------------------------------------------------
      # Node.js
      # ------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # ------------------------------------------------------------
      # Java 21
      # (Capacitor 8 / AGP 8.13+ needs JDK 21; JDK 17 can fail the build)
      # ------------------------------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # ------------------------------------------------------------
      # Android SDK
      # ------------------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ------------------------------------------------------------
      # Environment
      # ------------------------------------------------------------
      - name: Show environment
        shell: bash
        run: |
          echo "========== ENVIRONMENT =========="

          echo ""
          echo "Node:"
          node --version

          echo ""
          echo "NPM:"
          npm --version

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "JAVA_HOME:"
          echo "$JAVA_HOME"

          echo ""
          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo ""
          echo "ANDROID_SDK_ROOT:"
          echo "$ANDROID_SDK_ROOT"

          echo ""
          echo "Disk:"
          df -h

          echo ""
          echo "Memory:"
          free -h

      # ------------------------------------------------------------
      # Install npm
      # ------------------------------------------------------------
      - name: Install dependencies
        shell: bash
        run: |
          echo "========== NPM CI =========="

          npm ci

      # ------------------------------------------------------------
      # Build React/Vite
      # ------------------------------------------------------------
      - name: Build web app
        shell: bash
        run: |
          echo "========== WEB BUILD =========="

          npm run build

          echo ""
          echo "========== DIST =========="

          test -d dist
          find dist -maxdepth 3 -type f -print

      # ------------------------------------------------------------
      # Capacitor
      # ------------------------------------------------------------
      - name: Check Capacitor
        shell: bash
        run: |
          echo "========== CAPACITOR =========="

          npx cap --version

          echo ""
          echo "Capacitor packages:"
          npm list @capacitor/core @capacitor/cli @capacitor/android || true

      # ------------------------------------------------------------
      # Check Android project
      # ------------------------------------------------------------
      - name: Check Android project
        shell: bash
        run: |
          echo "========== ANDROID PROJECT =========="

          if [ ! -d android ]; then
            echo "ERROR: android directory does not exist"
            exit 1
          fi

          echo ""
          echo "Android directory:"
          ls -la android

          echo ""
          echo "Gradle wrapper:"
          ls -la android/gradlew

          echo ""
          echo "Gradle properties:"
          cat android/gradle/wrapper/gradle-wrapper.properties

      # ------------------------------------------------------------
      # Capacitor sync
      # ------------------------------------------------------------
      - name: Sync Capacitor
        shell: bash
        run: |
          echo "========== CAPACITOR SYNC =========="

          npx cap sync android

      # ------------------------------------------------------------
      # Gradle permissions
      # ------------------------------------------------------------
      - name: Prepare Gradle
        working-directory: android
        shell: bash
        run: |
          echo "========== PREPARE GRADLE =========="

          chmod +x gradlew

          echo ""
          echo "gradlew:"
          ls -la gradlew

          echo ""
          echo "Gradle version:"
          ./gradlew --version

      # ------------------------------------------------------------
      # Gradle clean
      # ------------------------------------------------------------
      - name: Gradle clean
        working-directory: android
        shell: bash
        run: |
          echo "========== GRADLE CLEAN =========="

          ./gradlew clean \
            --stacktrace \
            --console=plain

      # ------------------------------------------------------------
      # BUILD APK
      #
      # IMPORTANT:
      # Gradle is executed DIRECTLY.
      # No tee.
      # No pipe.
      # No PIPESTATUS.
      # ------------------------------------------------------------
      - name: Build Android Debug APK
        working-directory: android
        shell: bash
        run: |
          echo "=========================================="
          echo "     BUILD ANDROID DEBUG APK"
          echo "=========================================="

          chmod +x gradlew

          echo ""
          echo "Starting Gradle assembleDebug..."
          echo ""

          ./gradlew assembleDebug \
            --stacktrace \
            --console=plain \
            --warning-mode=all

      # ------------------------------------------------------------
      # Show APK
      # ------------------------------------------------------------
      - name: Show APK
        if: always()
        shell: bash
        run: |
          echo "========== APK OUTPUT =========="

          if [ -d android/app/build/outputs ]; then
            find android/app/build/outputs -type f -print
          else
            echo "No APK output directory"
          fi

      # ------------------------------------------------------------
      # Collect Gradle reports
      # ------------------------------------------------------------
      - name: Collect Gradle reports
        if: always()
        shell: bash
        run: |
          echo "========== GRADLE REPORTS =========="

          mkdir -p diagnostics

          if [ -d android/app/build/reports ]; then
            cp -r android/app/build/reports diagnostics/app-reports
          fi

          if [ -d android/build/reports ]; then
            cp -r android/build/reports diagnostics/project-reports
          fi

          if [ -d android/app/build/outputs ]; then
            cp -r android/app/build/outputs diagnostics/outputs
          fi

          echo ""
          echo "Diagnostics:"
          find diagnostics -type f -print 2>/dev/null || true

      # ------------------------------------------------------------
      # Upload Gradle reports
      # ------------------------------------------------------------
      - name: Upload Gradle diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-diagnostics
          path: diagnostics
          if-no-files-found: warn
          retention-days: 7

      # ------------------------------------------------------------
      # Upload APK
      # ------------------------------------------------------------
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: crossworld-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30